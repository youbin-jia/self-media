version: '3.8'

services:
  # API 服务
  api:
    build: .
    container_name: self-media-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./data/video_automation.db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-eastasia}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-claude}
      - DEFAULT_TTS_PROVIDER=${DEFAULT_TTS_PROVIDER:-azure}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker
  worker:
    build: .
    container_name: self-media-worker
    command: ["conda", "run", "-n", "self-media", "celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "high,medium,low"]
    working_dir: /app/backend
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./data/video_automation.db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-eastasia}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat (定时任务调度)
  beat:
    build: .
    container_name: self-media-beat
    command: ["conda", "run", "-n", "self-media", "celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    working_dir: /app/backend
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: self-media-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # DailyHotApi - 热榜数据聚合服务
  dailyhot-api:
    image: imsyy/dailyhot-api:latest
    container_name: self-media-dailyhot
    ports:
      - "6688:6688"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6688/weibo"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
